# Builds bada for macOS on GitHub: the workspace's tests, then the input method from harness/mac,
# uploaded as the artifact "bada-mac" (a zip). A v* tag also attaches the zip to its release while
# that is a draft (one is created if there is none yet). A published release can't be changed, so
# the tag is pushed before the release is published: CLAUDE.md has the order.
#
# It is signed with the certificate in the secrets APPLE_CERTIFICATE_P12 (base64 of a .p12) and
# APPLE_CERTIFICATE_PASSWORD, so macOS keeps the app's Input Monitoring and Accessibility
# permissions across installs. Pull requests, and runs with no certificate, build ad-hoc signed.
# There is no notarization step, as in bada ime.
#
# What this expects of harness/mac, as bada ime's mac/ has it: a Makefile whose `make dist` writes
# build/<name>.zip and signs with SIGN_IDENTITY ("-" is ad-hoc). Until harness/mac/Makefile exists
# the build job is skipped.

name: mac

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine/**"
      - "crates/**"
      - "harness/mac/**"
      - "VERSION"
      - ".github/workflows/mac.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ready:
    name: Is there a harness to build?
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.check.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f harness/mac/Makefile ]; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::harness/mac has no Makefile yet: nothing to build"
          fi

  build:
    name: Test and build
    needs: ready
    if: needs.ready.outputs.mac == 'true'
    runs-on: macos-26
    permissions:
      contents: write   # the release, on a v* tag
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Signing certificate
        if: github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "::warning::No APPLE_CERTIFICATE_P12 secret: building ad-hoc signed"; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The identity's name holds its owner's name or email, and this log is public: it is
          # never printed here, and it is masked wherever a later step would print it.
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          [ -n "$identity" ] || { echo "::error::The .p12 holds no valid code-signing identity"; exit 1; }
          echo "::add-mask::$identity"
          owner=$(printf '%s' "$identity" | sed -n 's/^[^:]*: \(.*\) ([A-Z0-9]*)$/\1/p')
          [ -z "$owner" ] || echo "::add-mask::$owner"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing with the certificate from the secrets"
      - name: Build
        working-directory: harness/mac
        run: |
          make dist SIGN_IDENTITY="${SIGN_IDENTITY:--}"
          for app in build/*.app; do codesign -dvv "$app" 2>&1 | grep -E "^(Identifier|TeamIdentifier|Signature)" || true; done
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: bada-mac
          path: harness/mac/build/*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The repository's releases are immutable: once one is published its files can't be
          # replaced. So the zip goes onto a draft, and a published release is left as it is.
          tag="${GITHUB_REF#refs/tags/}"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            true) gh release upload "$tag" harness/mac/build/*.zip --clobber ;;
            false) echo "::notice::Release $tag is published already, so its files can't be replaced. This run's zip is its artifact only." ;;
            *) gh release create "$tag" harness/mac/build/*.zip --draft --title "bada $(cat VERSION)" --generate-notes ;;
          esac
