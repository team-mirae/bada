# Deploys the web harness (harness/web) to Vercel on every push to main that touches the page or
# the engine it runs.
#
# The site is built here, not on Vercel: it compiles the engine to WebAssembly with Rust, which
# Vercel's build image doesn't have. The build writes harness/web/.vercel/output (the Build Output
# API) and `vercel deploy --prebuilt` uploads it.
#
# Needs the repository secret VERCEL_TOKEN (a Vercel access token for the themrsungs-projects team).
#
# What this expects of harness/web, as bada ime's web/ has it: `node build.mjs --vercel` builds the
# site, and test/smoke.mjs, if there is one, gates the deploy. Until harness/web/build.mjs exists
# the deploy job is skipped.

name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "engine/**"
      - "crates/**"
      - "harness/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling one halfway.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Not secrets: they name the Vercel team (themrsungs-projects) and project (bada).
  VERCEL_ORG_ID: team_CzVKrhjMVhZUWfSbyNlJbMSP
  VERCEL_PROJECT_ID: prj_m5IdPBpJK8cgeOZn3cuthhDYuUDL

jobs:
  ready:
    name: Is there a site to deploy?
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f harness/web/build.mjs ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::harness/web has no build.mjs yet: nothing to deploy"
          fi

  deploy:
    name: Build, test and deploy
    needs: ready
    if: needs.ready.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build (the engine to wasm, the page, the data)
        run: node harness/web/build.mjs --vercel
      - name: Smoke test
        run: |
          if [ -f harness/web/test/smoke.mjs ]; then
            node harness/web/test/smoke.mjs
          else
            echo "::notice::No harness/web/test/smoke.mjs: deploying untested"
          fi
      - name: Deploy to production
        working-directory: harness/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::Set the secret VERCEL_TOKEN"; exit 1; }
          npx --yes vercel@62 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
