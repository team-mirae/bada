[package]
name = "bada-cli"
description = "bada, the command line: it checks the settings folder's files and serves them to the settings page."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "bada_cli"
path = "src/lib.rs"

[[bin]]
name = "bada"
path = "src/main.rs"

[dependencies]
bada-engine = { path = "../engine" }
bada-compat = { path = "../crates/compat" }
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
