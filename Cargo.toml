[workspace]
resolver = "3"
members = ["crates/compat", "engine", "tools/conformance", "tools/sign", "cli"]

[workspace.package]
# One version for everything in the repository: it is the VERSION file's (crates/compat checks).
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Mirae Research"]
repository = "https://github.com/team-mirae/bada"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
